[project]
name = "ai-governance-hub"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
hub = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "pydantic-settings>=2.5",
    "pyjwt[crypto]>=2.9",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]
agents = [
    "mcp>=1.28.1,<2",
    "strands-agents>=1.63.0",
]

[dependency-groups]
dev = [
    "moto[dynamodb]>=5",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Body()/Depends() in defaults is the framework idiom

[tool.ruff.lint.per-file-ignores]
# one-off deploy scripts keep their compact one-line style (reviewed 2026-11-04)
"deploy/**" = ["E701", "E702", "E741"]
"agents/**" = ["E701", "E702", "E741"]
