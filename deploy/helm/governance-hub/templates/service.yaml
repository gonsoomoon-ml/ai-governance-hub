apiVersion: v1
kind: Service
metadata:
  name: {{ include "governance-hub.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "governance-hub.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "governance-hub.selectorLabels" . | nindent 4 }}
