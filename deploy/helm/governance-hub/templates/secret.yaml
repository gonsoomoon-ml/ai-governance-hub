apiVersion: v1
kind: Secret
metadata:
  name: {{ include "governance-hub.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "governance-hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
