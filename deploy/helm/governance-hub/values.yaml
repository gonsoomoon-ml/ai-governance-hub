# AI Governance Hub — Helm values. Real deployment values (ECR, role ARN, hosts, tokens) live only on the
# deploy host, never in this public repo: copy this file, replace every CHANGE_ME, pass it with -f.
# Prototype limit: secrets below are plain values rendered into one Kubernetes Secret (no ESO).

replicaCount: 1

image:
  repository: CHANGE_ME            # e.g. 123456789012.dkr.ecr.us-west-2.amazonaws.com/llm-gateway/governance-hub
  tag: "0.1.14"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: governance-hub
  annotations:
    # IRSA: DynamoDB table + Agent Registry + AgentCore Gateway targets (deploy/hub/10-table-and-role.py)
    eks.amazonaws.com/role-arn: CHANGE_ME

service:
  port: 8080

# Plain environment (ConfigMap). Names = hub/config.py Settings fields, upper-case.
env:
  HUB_LANG: "ko"
  HUB_TZ: "Asia/Seoul"             # screen time zone for timestamps (IANA name)
  AWS_REGION: "us-west-2"
  DDB_TABLE: "ai-governance-hub"
  # LLM gateway admin-api over in-cluster DNS (no VPN needed)
  ADMIN_API_URL: "http://llm-gateway-admin-api.llm-gateway.svc:8080"
  # Cognito (same pool as the gateway; the hub callback is registered on the CLI/admin-ui app client)
  OIDC_ISSUER: "https://cognito-idp.us-west-2.amazonaws.com/CHANGE_ME_POOL_ID"
  OIDC_CLIENT_ID: "CHANGE_ME"
  OIDC_AUTHORIZE_URL: "https://CHANGE_ME_DOMAIN.auth.us-west-2.amazoncognito.com/oauth2/authorize"
  OIDC_TOKEN_URL: "https://CHANGE_ME_DOMAIN.auth.us-west-2.amazoncognito.com/oauth2/token"
  OIDC_REDIRECT_URI: "https://hub-dev.CHANGE_ME/auth/callback"
  OIDC_SCOPES: "openid email profile"
  ADMIN_GROUP: "ClaudeAdmin"
  # AgentCore (in-house agents) — from deploy/agentcore/.env; leave empty to hide the feature
  AGENTCORE_REGISTRY_ID: ""
  AGENTCORE_GATEWAY_ID: ""
  AGENTCORE_GATEWAY_URL: ""
  MCP_OAUTH_CLIENT_ID: ""
  MCP_OAUTH_CALLBACK_PORT: "8094"
  MCP_OAUTH_METADATA_URL: "https://cognito-idp.us-west-2.amazonaws.com/CHANGE_ME_POOL_ID/.well-known/openid-configuration"
  MCP_OAUTH_SCOPES: "openid email"

# Secret environment (one Kubernetes Secret, plain values in the deploy host's copy of this file).
secrets:
  HUB_TOKEN: CHANGE_ME             # must equal gateway-proxy POLICY_HUB_TOKEN
  ADMIN_API_TOKEN: CHANGE_ME       # admin-api service token (svc-...), issued via POST /admin/service-tokens
  SESSION_SECRET: CHANGE_ME        # openssl rand -hex 32
  OIDC_CLIENT_SECRET: ""           # empty for a public app client

ingress:
  enabled: true
  className: alb
  host: hub-dev.CHANGE_ME
  annotations:
    # internet-facing + inbound-cidrs, exactly how the gateway's admin-ui Ingress is reached (no internal ALB there)
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: CHANGE_ME
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/success-codes: "200"
    # admin console reachability: same allow-list as the gateway's admin-ui Ingress (VPN / office egress)
    alb.ingress.kubernetes.io/inbound-cidrs: CHANGE_ME

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: 500m, memory: 512Mi }

podAnnotations: {}
nodeSelector: {}
tolerations: []
